<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quantum Papers</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--soft:#efede7;--ink:#1d1d1f;--mute:#6c6c72;--line:#e2dfd7;--accent:#3b5bdb;--ok:#2b8a3e;
--add:#c3f0ca;--del:#ffc9c9;--sub:#ffe3a8;--hl:#d0ebff;--com:#e5dbff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--panel:#1d1e23;--soft:#26272d;--ink:#e9e9ee;--mute:#9b9ba5;--line:#33343b;--accent:#7b93ff;--ok:#69db7c;
--add:#1f5130;--del:#5c2424;--sub:#5a4416;--hl:#1b4165;--com:#3f2f66}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100vh;display:grid;grid-template-rows:52px 1fr;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,Segoe UI,sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--soft)} button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
header{display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;white-space:nowrap} header h1 small{color:var(--mute);font-weight:400}
#paletteOpen{flex:1;max-width:520px;margin:0 auto;text-align:left;color:var(--mute);background:var(--soft)}
#paletteOpen kbd{float:right;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
main{display:grid;grid-template-columns:260px 1fr 300px;min-height:0}
nav,#side{overflow:auto;background:var(--panel);padding:10px 8px}
nav{border-right:1px solid var(--line)} #side{border-left:1px solid var(--line)}
.vault{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:14px 6px 4px}
.folder,.paper{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.folder{color:var(--mute);font-weight:600}
.folder:hover,.paper:hover{background:var(--soft)} .paper.sel{background:var(--accent);color:#fff}
.paper .tag{margin-left:auto;font-size:11px;opacity:.7}
.queue{display:flex;justify-content:space-between;padding:4px 8px;border-radius:6px;cursor:pointer}.queue:hover{background:var(--soft)}
.count{background:var(--soft);border-radius:9px;padding:0 7px;font-size:12px}
#center{overflow:auto;padding:28px 40px}
#empty{max-width:520px;margin:12vh auto;text-align:center;color:var(--mute)}
#empty h2{color:var(--ink)}
#paperHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto 6px}
#paperHead h2{margin:0 auto 0 0;font-size:20px}
#origin{max-width:760px;margin:0 auto 18px;color:var(--mute);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--accent);color:#fff}
#read{max-width:760px;margin:auto;font:17px/1.7 Georgia,serif}
#read a{color:var(--accent)}
#editor{display:block;width:100%;max-width:760px;margin:auto;min-height:65vh;padding:18px;font:14px/1.7 ui-monospace,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;resize:vertical}
ins.cm{background:var(--add);text-decoration:none} del.cm{background:var(--del)} mark.cm{background:var(--hl);color:inherit}
span.cm-sub{background:var(--sub)} span.cm-com{background:var(--com);font-size:.8em;padding:0 4px;border-radius:4px;font-family:system-ui}
.tabs{display:flex;gap:4px;margin-bottom:10px}.tabs button{flex:1;font-size:12px}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:12px}
.item b{font-size:13px} .item .when{color:var(--mute)} .item a{color:var(--accent);cursor:pointer}
.mute{color:var(--mute);font-size:12px}
#palette,#picker{border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,92vw);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px #0005}
#palette::backdrop,#picker::backdrop{background:#0004}
#pq{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:16px;background:transparent;outline:none}
#plist{max-height:50vh;overflow:auto;padding:6px}
.opt{display:flex;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.opt.on{background:var(--accent);color:#fff}.opt small{margin-left:auto;opacity:.7}
#picker form{padding:16px} #picker select{width:100%;margin:12px 0;padding:6px}
#menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:0 10px 30px #0004;z-index:9;min-width:200px}
#menu div{padding:6px 10px;border-radius:6px;cursor:pointer}#menu div:hover{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0004;max-width:92vw}
#toast button{background:transparent;color:inherit;border-color:currentColor}
@media(max-width:1000px){main{grid-template-columns:220px 1fr}#side{display:none}}
@media(max-width:640px){main{grid-template-columns:1fr}nav{max-height:30vh}#center{padding:16px}header h1 small{display:none}}
</style>
<header>
  <h1>⚛ Quantum Papers <small>· one original, every place it belongs</small></h1>
  <button id="paletteOpen">Search papers or run an action… <kbd>Ctrl K</kbd></button>
  <button id="undoBtn" title="Undo last move">↶ Undo</button>
</header>
<main>
  <nav id="tree" aria-label="Vaults"></nav>
  <section id="center">
    <div id="empty"><h2>Your papers, connected</h2><p>Pick a paper on the left, or press <b>Ctrl K</b> to find any paper or run any action.</p><p class="mute">Right-click a paper for quick actions.</p></div>
    <div id="paperView" hidden>
      <div id="paperHead"><h2 id="title"></h2>
        <span class="seg"><button id="mRead" class="on">Read</button><button id="mEdit">Edit</button></span>
        <button id="save" class="primary" hidden>Save</button>
        <button id="moreBtn">⋯</button>
      </div>
      <div id="origin"></div>
      <div id="read"></div>
      <textarea id="editor" hidden aria-label="Paper Markdown"></textarea>
    </div>
  </section>
  <aside id="side">
    <div class="tabs"><button data-tab="links" class="on">Links</button><button data-tab="history">History</button><button data-tab="tangents">Tangents</button></div>
    <div id="sideBody"><p class="mute">Open a paper to see its links, history and tangents.</p></div>
  </aside>
</main>
<dialog id="palette"><input id="pq" placeholder="Type a paper name or an action…" autocomplete="off"><div id="plist"></div></dialog>
<dialog id="picker"><form method="dialog"><b id="pickTitle">Choose a folder</b><select id="pickSel"></select><div style="text-align:right"><button value="cancel">Cancel</button> <button value="ok" class="primary">Apply</button></div></form></dialog>
<div id="menu" hidden></div>
<div id="toast" hidden><span id="toastText"></span><button id="toastUndo" hidden>Undo</button></div>
<script type="module" src="/app.js"></script>
</html>
